version: "3.9"

# Profiles:
#   core  — postgres, redis, kafka (minimum for platform)
#   full  — all observability/search/graph infra
#
# Usage:
#   docker compose --profile core up -d
#   docker compose --profile full up -d

x-core-profile: &core-profile
  profiles: ["core", "full"]

x-full-only: &full-only
  profiles: ["full"]

services:
  postgres:
    <<: *core-profile
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trinetra
      POSTGRES_PASSWORD: trinetra_dev
      POSTGRES_DB: trinetra360
    ports:
      # Host-only bind — do not expose Postgres on the public interface (PRR)
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trinetra"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    <<: *core-profile
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          memory: 192M

  mongodb:
    <<: *full-only
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  neo4j:
    <<: *full-only
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/trinetra_dev
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  opensearch:
    <<: *full-only
    image: opensearchproject/opensearch:2.17.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  kafka:
    <<: *core-profile
    image: bitnamilegacy/kafka:3.7.0-debian-12-r5
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka

  rabbitmq:
    <<: *full-only
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  prometheus:
    <<: *full-only
    image: prom/prometheus:v2.54.0
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    <<: *full-only
    image: grafana/grafana:11.2.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana

  jaeger:
    <<: *full-only
    image: jaegertracing/all-in-one:1.61
    ports:
      - "16686:16686"
      - "4318:4318"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: ["otel", "full"]
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      OPSEDGE_OTLP_ENDPOINT: ${OPSEDGE_OTLP_ENDPOINT:-http://observability:4003}
      OPSEDGE_TENANT_ID: ${OPSEDGE_TENANT_ID:-default}
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "14318:4318"
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  neo4j_data:
  opensearch_data:
  kafka_data:
  grafana_data:
