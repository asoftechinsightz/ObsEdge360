name: CI/CD — OpsEdge360 Sprint 0

on:
  push:
    branches: [main, develop, feature/sprint0-enterprise-foundation]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and lint
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Build all workspaces
        run: npm run build

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: '1'

      - name: Run Trivy HIGH (non-blocking)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH
          exit-code: '0'

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

  license-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: License check
        run: npx license-checker --summary --production

  docker-build:
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/sprint0-enterprise-foundation'
    steps:
      - uses: actions/checkout@v4

      - name: Build API Gateway image
        run: docker build -t opsedge360/api-gateway:latest -f apps/api-gateway/Dockerfile .

      - name: Build Web image
        run: docker build -t opsedge360/web:latest -f apps/web/Dockerfile .

      - name: Scan API Gateway image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: opsedge360/api-gateway:latest
          severity: CRITICAL
          exit-code: '1'

  python-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r ai-agents/requirements.txt
      - run: python -c "import sys; sys.path.insert(0,'ai-agents'); from src.main import app; print('OK')"
