name: CI/CD — OpsEdge360

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npm run build -w @opsedge360/shared-types

      - name: Build API Gateway
        run: npm run build -w @opsedge360/api-gateway

      - name: Build Web
        run: npm run build -w @opsedge360/web

  python-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AI agents dependencies
        run: pip install -r ai-agents/requirements.txt

      - name: Validate AI agents import
        run: python -c "from ai_agents.src.main import app" 2>/dev/null || python -c "import sys; sys.path.insert(0,'ai-agents'); from src.main import app; print('OK')"

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'

  docker-build:
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build API Gateway image
        run: docker build -t trinetra360/api-gateway:latest -f apps/api-gateway/Dockerfile .

      - name: Build Web image
        run: docker build -t trinetra360/web:latest -f apps/web/Dockerfile .

  deploy-staging:
    needs: [docker-build, python-agents]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging (Helm)
        run: echo "helm upgrade --install trinetra360 infra/helm/trinetra360 -n trinetra360-staging"
