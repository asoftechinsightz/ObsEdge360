replicaCount: 2
image:
  gateway: opsedge360-api-gateway:latest
  web: opsedge360-web:latest
  pullPolicy: IfNotPresent
service:
  gatewayPort: 4000
  webPort: 3000
ingress:
  enabled: true
  host: observability360.example.com
  tls: true
env:
  DEPLOYMENT_MODE: onprem
  PERFORMANCE_PROFILE: high
  HA_MODE: active
  HA_MULTI_NODE: "true"
  GATEWAY_REPLICAS: "2"
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
affinity:
  podAntiAffinity: preferred
persistence:
  enabled: true
  size: 20Gi
  storageClass: ""
note: Wave 2 HA values — multi-replica gateway foundation
