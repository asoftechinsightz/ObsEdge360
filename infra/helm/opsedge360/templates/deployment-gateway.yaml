apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api-gateway
  labels:
    app: opsedge360-api-gateway
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: opsedge360-api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: opsedge360-api-gateway
    spec:
      {{- if eq (.Values.affinity.podAntiAffinity | default "preferred") "preferred" }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: opsedge360-api-gateway
                topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: api-gateway
          image: {{ if .Values.image.registry }}{{ .Values.image.registry }}/{{ end }}{{ .Values.image.gateway }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.gatewayPort }}
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources.gateway | nindent 12 }}
          {{- end }}
          env:
            - name: DEPLOYMENT_MODE
              value: {{ .Values.env.DEPLOYMENT_MODE | quote }}
            - name: PERFORMANCE_PROFILE
              value: {{ .Values.env.PERFORMANCE_PROFILE | quote }}
            - name: HA_MODE
              value: {{ .Values.env.HA_MODE | default "active" | quote }}
            - name: HA_MULTI_NODE
              value: {{ .Values.env.HA_MULTI_NODE | default "true" | quote }}
            - name: GATEWAY_REPLICAS
              value: {{ .Values.replicaCount | quote }}
          startupProbe:
            httpGet:
              path: /api/v1/live
              port: {{ .Values.service.gatewayPort }}
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/live
              port: {{ .Values.service.gatewayPort }}
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: {{ .Values.service.gatewayPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
