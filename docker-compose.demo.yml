# Demo data plane — separate Postgres (+ optional redis) from production.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml --profile demo up -d postgres-demo
#   POSTGRES_HOST=postgres-demo POSTGRES_DB=opsedge360_demo APP_ENV=demo ...
#
# Logical databases:
#   opsedge360_prod | opsedge360_demo | opsedge360_dev | opsedge360_local

services:
  postgres-demo:
    profiles: ["demo"]
    image: postgres:16-alpine
    container_name: opsedge360-postgres-demo-1
    environment:
      POSTGRES_USER: ${DEMO_POSTGRES_USER:-opsedge_demo}
      POSTGRES_PASSWORD: ${DEMO_POSTGRES_PASSWORD:?DEMO_POSTGRES_PASSWORD required}
      POSTGRES_DB: ${DEMO_POSTGRES_DB:-opsedge360_demo}
    volumes:
      - opsedge360_demo_pgdata:/var/lib/postgresql/data
      - ./database/migrations:/migrations:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis-demo:
    profiles: ["demo"]
    image: redis:7-alpine
    container_name: opsedge360-redis-demo-1
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - opsedge360_demo_redis:/data
    ports:
      - "127.0.0.1:6380:6379"
    restart: unless-stopped

volumes:
  opsedge360_demo_pgdata:
  opsedge360_demo_redis:
